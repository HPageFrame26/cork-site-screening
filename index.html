<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site screening: Cork</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root {
    --ink: #1c1c1c; --dim: #666; --line: #e4e4e4; --wash: #f5f5f4; --panel: #fff;
    /* rating colours taken from the Uisce Eireann capacity register's own Green, Amber, Red */
    --good: rgb(0,128,0); --mid: rgb(255,140,0); --bad: rgb(200,16,46);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.45; color: var(--ink); }
  #wrap { display: flex; height: 100%; }
  #panel { flex: 0 0 420px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); z-index: 2; min-height: 0; }
  #mapwrap { flex: 1 1 auto; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; background: rgb(242,243,240); }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header { padding: 16px 20px 0; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 20px; margin-top: 14px; }
  .tabs button { border: 0; background: none; padding: 0 0 10px; color: var(--dim); border-bottom: 3px solid transparent; font-weight: bold; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .filters { display: flex; align-items: center; gap: 14px; padding: 14px 0 6px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  .filters select { font: inherit; height: 32px; border: 1px solid #bbb; border-radius: 6px; padding: 0 6px; background: #fff; color: var(--ink); }
  .filters input { accent-color: var(--ink); }
  .site { display: grid; grid-template-columns: 26px 1fr 40px; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 0; }
  .site:hover { background: var(--wash); }
  .site .rk { color: var(--dim); font-size: 12px; padding-top: 2px; }
  .site b { display: block; }
  .site small { color: var(--dim); }
  .site .sc { font-size: 17px; font-weight: bold; text-align: right; align-self: center; }
  .title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .title b { font-size: 16px; }
  .title span { color: var(--dim); font-size: 12px; }
  #searchform { display: flex; gap: 8px; }
  #search { flex: 1; min-width: 0; height: 38px; padding: 0 12px; font: inherit; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
  #search:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .btn { height: 38px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 6px; background: var(--ink); color: #fff; }
  .btn.ghost { background: #fff; color: var(--ink); border-color: #bbb; }
  .btn:focus-visible, summary:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #searchmsg { font-size: 12px; color: var(--dim); min-height: 0; }
  #searchmsg:not(:empty) { margin-top: 6px; }

  #body { flex: 1 1 auto; overflow-y: auto; padding: 0 20px 20px; }
  footer { padding: 10px 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; gap: 12px; }
  .linkbtn { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--dim); font-size: 12px; }

  .empty { padding: 28px 0 8px; color: var(--dim); }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

  .place { padding: 18px 0 2px; }
  .place h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  .place small { color: var(--dim); font-size: 12px; }
  .scorebox { display: flex; align-items: center; gap: 18px; padding: 14px 0 16px; }
  .ring { flex: 0 0 96px; position: relative; width: 96px; height: 96px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .verdict b { font-size: 18px; display: block; }
  .verdict span { color: var(--dim); font-size: 13px; }
  .cap { border-left: 4px solid var(--bad); background: var(--wash); padding: 10px 12px; margin: 0 0 12px; border-radius: 0 6px 6px 0; font-size: 13px; }
  .cap.soft { border-left-color: var(--mid); }
  .actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .actions .btn { height: 34px; font-size: 13px; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .actions { flex-wrap: wrap; }
  .parcel { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 4px; margin: 10px 0 2px; font-size: 13px; }
  .parcel.warn { border-left: 4px solid var(--mid); }
  .parcel p { margin: 6px 0; font-size: 12px; }
  .chip { display: inline-block; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0 0; color: var(--dim); }
  .chip b { color: var(--ink); }

  h2 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); margin: 22px 0 4px; font-weight: bold; }
  details.factor { border-bottom: 1px solid var(--line); }
  details.factor summary { list-style: none; display: grid; grid-template-columns: 1fr 34px; grid-template-rows: auto auto; column-gap: 12px; padding: 11px 0 12px; cursor: pointer; }
  details.factor summary::-webkit-details-marker { display: none; }
  .fname { font-weight: bold; }
  .fsum { color: var(--dim); font-size: 13px; font-weight: normal; margin-left: 6px; }
  .fmark { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; font-size: 17px; font-weight: bold; }
  .bar { grid-column: 1; height: 6px; background: var(--wash); border-radius: 3px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .fbody { padding: 0 0 14px; font-size: 13px; color: #333; }
  .weight { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--dim); font-size: 12px; }
  .weight input { flex: 1; accent-color: var(--ink); }
  .weight output { width: 22px; text-align: right; color: var(--ink); font-weight: bold; }
  table.mini { width: 100%; border-collapse: collapse; margin: 8px 0; }
  table.mini td { padding: 3px 8px 3px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .num { text-align: right; white-space: nowrap; }
  .dim { color: var(--dim); }
  #workings { font-size: 12px; color: var(--dim); margin: 10px 0 0; }

  .app { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .app .top { display: flex; justify-content: space-between; gap: 10px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .app p { margin: 2px 0 0; color: var(--dim); }

  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  table.cmp th, table.cmp td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); text-align: right; vertical-align: bottom; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: var(--dim); font-weight: normal; }
  table.cmp th button { border: 0; background: none; padding: 0; font-weight: bold; text-decoration: underline; text-align: right; }
  table.cmp .x { color: var(--dim); font-size: 11px; text-decoration: underline; border: 0; background: none; padding: 0; }
  table.cmp tr.total td { font-weight: bold; font-size: 15px; }

  #layers { position: absolute; top: 12px; right: 12px; width: 232px; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.12); font-size: 13px; z-index: 1; }
  #layers summary { padding: 9px 12px; font-weight: bold; cursor: pointer; }
  #layers .rows { padding: 0 12px 10px; }
  #layers label { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #layers input { accent-color: var(--ink); margin: 0; }
  .legend { margin: 0 0 6px 21px; font-size: 11.5px; color: var(--dim); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .legend span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
  #status { position: absolute; left: 12px; bottom: 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--dim); z-index: 1; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  #status[hidden] { display: none; }

  .pin { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); border: 4px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .maplibregl-popup-content { font: 13px/1.4 Arial, Helvetica, sans-serif; padding: 10px 12px; border-radius: 6px; max-width: 260px; }
  .maplibregl-popup-content b { display: block; }

  dialog { border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; max-width: 720px; width: calc(100% - 32px); font-size: 13px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 10px; font-size: 16px; }
  dialog table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  dialog td, dialog th { text-align: left; padding: 6px 10px 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  dialog th { border-top: 0; color: var(--dim); font-weight: normal; }

  ul.notes { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
  ul.notes li { margin-bottom: 6px; }
  #report { display: none; }
  @media print {
    @page { size: A4; margin: 14mm; }
    #wrap, dialog { display: none !important; }
    html, body { height: auto; }
    #report { display: block; font-size: 10.5pt; line-height: 1.4; color: #000; }
    #report h1 { font-size: 20pt; margin: 0; }
    #report h2 { font-size: 9pt; margin: 14pt 0 4pt; color: #444; }
    #report p { margin: 2pt 0 6pt; }
    #report table { width: 100%; border-collapse: collapse; margin: 4pt 0; }
    #report td, #report th { text-align: left; vertical-align: top; padding: 3pt 8pt 3pt 0; border-top: 0.5pt solid #bbb; font-size: 9.5pt; }
    #report th { border-top: 0; color: #444; font-weight: normal; }
    #report .num { text-align: right; white-space: nowrap; }
    #report .rhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16pt; border-bottom: 1.5pt solid #000; padding-bottom: 8pt; margin-bottom: 8pt; }
    #report .rscore { border: 3pt solid; border-radius: 6px; padding: 4pt 12pt; text-align: center; }
    #report .rscore b { display: block; font-size: 24pt; line-height: 1.1; }
    #report .rscore span { font-size: 9pt; }
    #report .rcap { border-left: 3pt solid #000; padding-left: 8pt; }
    #report .rcols { display: grid; grid-template-columns: 1fr 1fr; gap: 14pt; }
    #report img { width: 100%; border: 0.5pt solid #999; }
    #report .rsmall, #report .dim { font-size: 8.5pt; color: #444; }
    #report .parcel { border: 0.5pt solid #999; padding: 6pt 8pt 2pt; margin-top: 6pt; }
    #report a { color: inherit; text-decoration: none; }
    #report tr, #report li { break-inside: avoid; }
  }
  @media (max-width: 820px) {
    #wrap { flex-direction: column-reverse; }
    #panel { flex: 1 1 55%; border-right: 0; border-top: 1px solid var(--line); }
    #mapwrap { flex: 0 0 45%; }
    #layers { width: 200px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <aside id="panel">
    <header>
      <div class="title"><b>Site screening</b><span>Cork City and County · prototype</span></div>
      <form id="searchform"><input id="search" placeholder="Search a town, townland or address" autocomplete="off"><button class="btn" type="submit">Search</button></form>
      <div id="searchmsg"></div>
      <div class="tabs"><button data-v="score" class="on">Score a site</button><button data-v="best">Best open sites</button></div>
    </header>
    <div id="body"></div>
    <footer><span>Scored for a residential scheme, from public data.</span><button class="linkbtn" id="srcbtn">Data and sources</button></footer>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <details id="layers" open><summary>Map layers</summary><div class="rows" id="layerrows"></div></details>
    <div id="status">Loading data…</div>
  </div>
</div>
<dialog id="sources"></dialog>
<div id="report"></div>
<script src="lib/maplibre-gl.js"></script>
<script src="gate.js"></script>
</body>
</html>
